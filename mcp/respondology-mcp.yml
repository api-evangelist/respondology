agent_notes:
- 'The API is submit-then-webhook: no tool can return a moderation decision synchronously. An agent must
  correlate on request_id and wait for a callback, which does not fit a request/response tool contract
  without a polling loop over the status endpoints.'
- No idempotency guard exists on either submit tool, so a retried tool call creates a duplicate record.
