aid: respondology
name: Respondology
description: >-
  Respondology is a Boulder, Colorado social media Comment Activation Platform that helps brands moderate,
  analyze, and activate the conversations happening in their comment sections. Its three products share one
  platform: Moderate hides brand-damaging, spam, and toxic comments in under a second using keyphrase and
  business rules, generative AI, and human moderators across 100+ languages; Respond centralizes paid and
  organic social comments into a unified inbox and uses AI agents to reply in the brand voice; and Discover
  pulls comment data from any public handle for sentiment, theme, and trend analysis. Respondology publishes
  a public OpenAPI 3.1 contract for its external moderation API, letting customers submit posts and comments
  for moderation and analysis and receive results asynchronously over webhooks.
