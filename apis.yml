apis:
- aid: respondology-api
  name: Respondology API
  description: >-
    The Respondology external API accepts posts and comments for moderation and analysis and returns results
    asynchronously over customer-configured webhooks. Nine REST operations cover submitting, updating,
    retrieving, and deleting comments and posts, plus a reference table of moderation rejection reasons. Six
    OpenAPI 3.1 webhook definitions describe the comment and post result, update, and error callbacks.
    Authentication is an X-Api-Key header issued during onboarding by a Respondology account manager.
  humanURL: https://respondology.com/product/
  baseURL: https://webhooks.respondology.io/
