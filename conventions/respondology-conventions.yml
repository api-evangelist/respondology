async_model:
  style: submit-then-webhook
  note: Submissions return an acceptance (200/202) immediately; the moderation/analysis outcome arrives
    later by webhook. Callers must not treat the 200 as the moderation decision.
dry_run_mode:
  supported: false
  grade: absent
  note: 'No test mode, sandbox flag, or simulate parameter is documented. The `moderate: false` flag on
    a comment submission causes the comment to be recorded and analyzed WITHOUT a moderation action —
    the closest thing to a non-acting call, but it is a product mode, not a rehearsal of a moderating
    call.'
reversibility:
  grade: documented
  applicable: true
  note: The API has write surfaces (submit/update/delete for comments and posts), and each has a reversal
    or correction path published in the contract. No reversal WINDOW is stated anywhere in the docs, so
    this grades `documented` rather than `verified`.
  surfaces:
  - write: POST /external_api/v1/comments
    operation_id: null
    action: submit a comment for moderation
    reversal: DELETE /external_api/v1/comments/{id}
    reversal_operation_id: null
    window: null
    window_source: null
    note: Delete is accepted asynchronously (202). The contract does not state whether deleting after
      a moderation decision reverses a hide already applied on the social platform, nor any time limit.
  - write: PATCH /external_api/v1/comments/{id}
    action: update a previously submitted comment
    reversal: PATCH /external_api/v1/comments/{id}
    window: null
    note: 'An update is itself the correction path — resubmitting the prior message restores prior state,
      and re-moderation fires a comment_update_result webhook. Not a true undo: the intermediate moderation
      decision is not rolled back.'
  - write: POST /external_api/v1/posts
    action: submit a post for analysis/recording
    reversal: DELETE /external_api/v1/posts/{id}
    window: null
    note: Accepted asynchronously (202). No stated retention or deletion window.
  - write: PATCH /external_api/v1/posts/{id}
    action: update a previously submitted post
    reversal: PATCH /external_api/v1/posts/{id}
    window: null
  gaps:
  - No reversal window is stated for any operation — an agent cannot know how long a delete remains possible.
  - DELETE returns 202 (accepted) with no result webhook declared, so there is no documented confirmation
    that a deletion actually completed.
  - Whether DELETE un-hides a comment already moderated on the source platform is not documented — the
    most consequential unanswered reversibility question in this API.
